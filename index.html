<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Musical</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #121212;
      color: white;
    }

    h1 { text-align: center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }

    .day {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
    }

    input, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      background: #1db954;
      color: white;
      cursor: pointer;
    }

    iframe {
      margin-top: 15px;
      width: 100%;
      height: 80px;
      border: none;
    }
  </style>
</head>
<body>

<h1>Calendario Musical</h1>
<div class="grid" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="dayTitle"></h2>

    <input type="text" id="username" placeholder="Tu nombre">
    <input type="text" id="spotifyLink" placeholder="Enlace de Spotify">

    <button onclick="saveSong()">Guardar</button>

    <div id="result"></div>
  </div>
</div>

<script>
  // 🔥 CONFIGURAR FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyCHpr65I6f7Ap4VQ3Q1Y6engILO_ImAe4M",
    authDomain: "retocanciones.firebaseapp.com",
    projectId: "retocanciones",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const calendar = document.getElementById('calendar');
  const modal = document.getElementById('modal');
  const dayTitle = document.getElementById('dayTitle');

  let currentDay = null;

  // Crear días
  for (let i = 1; i <= 30; i++) {
    const day = document.createElement('div');
    day.className = 'day';
    day.innerText = 'Día ' + i;
    day.onclick = () => openModal(i);
    calendar.appendChild(day);
  }

  function openModal(day) {
    currentDay = day;
    dayTitle.innerText = 'Día ' + day;
    modal.style.display = 'flex';
    loadSong();
  }

  window.onclick = function(e) {
    if (e.target === modal) modal.style.display = 'none';
  }

  async function saveSong() {
    const name = document.getElementById('username').value;
    const link = document.getElementById('spotifyLink').value;

    if (!name || !link) {
      alert('Completa todos los campos');
      return;
    }

    const embedLink = link.replace('open.spotify.com', 'open.spotify.com/embed');

    await db.collection('calendar').doc('day_' + currentDay).set({
      name,
      link: embedLink
    });

    loadSong();
  }

  async function loadSong() {
    const result = document.getElementById('result');
    result.innerHTML = 'Cargando...';

    const doc = await db.collection('calendar').doc('day_' + currentDay).get();

    if (doc.exists) {
      const data = doc.data();

      result.innerHTML = `
        <p><strong>${data.name}</strong> eligió:</p>
        <iframe src="${data.link}" allow="autoplay; encrypted-media"></iframe>
      `;
    } else {
      result.innerHTML = '<p>Nadie ha añadido canción aún</p>';
    }
  }
</script>

</body>
</html>

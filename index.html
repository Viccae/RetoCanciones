<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto De Canciones</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { font-family:'Segoe UI'; margin:0; padding:20px; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); color:white;}
h1{text-align:center; margin-top:40px;}

/* sesión arriba izquierda */
#sessionBar{
  position:relative;
  text-align:right;
  font-size:12px;
  margin-bottom:10px;
}

#logoutBtnTop{
  display:inline-block;
  width:auto !important;
  background:#ff4d4d;
  border:none;
  padding:3px 6px;
  font-size:11px;
  margin-left:5px;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;max-width:1000px;margin:auto;}

.day{
  border-radius:16px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.locked{opacity:.4;cursor:not-allowed;}
.empty{background:#1e1e1e;}
.partial{background:#d4a017;}
.full{background:#1db954;}

.avatars{
  display:flex;
  justify-content:center;
  gap:6px;
  font-size:14px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#1c1c1c;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:500px;
}

input,button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
}

button{background:#1db954;color:white;}

.song-block{margin-top:10px;}
</style>
</head>

<body>

<div id="sessionBar"></div>

<h1>🎶 Reto De Canciones</h1>

<div class="grid" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="dayTitle"></h2>

    <input id="username" placeholder="Nombre">
    <input id="password" type="password" placeholder="Contraseña">
    <input id="spotifyLink" placeholder="Link Spotify">

    <button onclick="saveSong()">Guardar</button>

    <div id="result"></div>
  </div>
</div>

<script>

// FIREBASE

const firebaseConfig = {
  apiKey: "AIzaSyCHpr65I6f7Ap4VQ3Q1Y6engILO_ImAe4M",
  authDomain: "retocanciones.firebaseapp.com",
  projectId: "retocanciones"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();



// CARGAR LOS ELEMENTOS HTML


const calendar = document.getElementById('calendar');
const modal = document.getElementById('modal');
const sessionBar = document.getElementById('sessionBar');



// CARGAR LA FECHA ACTUAL


const ahora = new Date();

const añoActual = ahora.getFullYear();
const mesActual = ahora.getMonth() + 1;
const hoy = ahora.getDate();


// CUANTOS DIAS TIENE EL MES ACTUAL PARA PODER AJUSTAR EL NUMERO DE CANCIONES Y ELEMENTOS HTML

const dias = new Date(
  añoActual,
  mesActual,
  0
).getDate();


// FLAG PARA CAMBIAR DE MES

let cambioDeMes = false;

// POOL DE RETOS

let dayMessages = {};
let poolRetos = [];

// USUARIOS


const allowedUsers = {
  "Carlo": "🤡",
  "Sara": "💀"
};

let currentUser = null;
let currentDay = null;
let calendarData = {};



// COMPROBAR CAMBIO DE MES


async function comprobarCambioDeMes(){

  const ref = db
    .collection('config')
    .doc('calendar');

  const doc = await ref.get();



  // cOMPROBAR CONFIUGURACION


  if(!doc.exists){

    cambioDeMes = true;

    console.log(
      "🌱 No existe configuración del calendario."
    );

    console.log(
      "🟢 cambioDeMes = TRUE"
    );

    return;
  }


  // Leer configuración

  const datos = doc.data();

  const ultimoMes = datos.month;
  const ultimoAño = datos.year;

  // Comparar

  if(
    ultimoMes !== mesActual ||
    ultimoAño !== añoActual
  ){

    cambioDeMes = true;

    console.log(
      "🌙 CAMBIO DE MES DETECTADO"
    );

    console.log(
      `Anterior: ${ultimoMes}/${ultimoAño}`
    );

    console.log(
      `Actual: ${mesActual}/${añoActual}`
    );

    console.log(
      "🟢 cambioDeMes = TRUE"
    );

  } else {

    cambioDeMes = false;

    console.log(
      "📅 Seguimos en el mismo mes."
    );

    console.log(
      "🔵 cambioDeMes = FALSE"
    );

  }

}



// CARGAR POOL DE RETOS


async function cargarPoolRetos(){

  const response = await fetch('retos.json');


  if(!response.ok){

    throw new Error(
      `No se pudo cargar retos.json (${response.status})`
    );

  }


  poolRetos = await response.json();


  if(!Array.isArray(poolRetos)){

    throw new Error(
      "retos.json no contiene una lista válida."
    );

  }


  console.log(
    `📝 Pool cargado: ${poolRetos.length} retos.`
  );

}



// rANDOMIZAR RETOS


function mezclar(array){

  const copia = [...array];


  // Fisher-Yates

  for(
    let i = copia.length - 1;
    i > 0;
    i--
  ){

    const j = Math.floor(
      Math.random() * (i + 1)
    );


    [
      copia[i],
      copia[j]
    ] = [
      copia[j],
      copia[i]
    ];

  }


  return copia;

}

// GENERAR RETOS DEL MES


function generarDayMessages(){

  dayMessages = {};


  if(poolRetos.length < dias){

    throw new Error(
      `No hay suficientes retos. ` +
      `Hay ${poolRetos.length} y se necesitan ${dias}.`
    );

  }


  // Mezclar el pool completo

  const retosMezclados = mezclar(poolRetos);


  // Elegir tantos como días tenga el mes

  const retosDelMes = retosMezclados.slice(
    0,
    dias
  );


  // Crear dayMessages

  for(let i = 1; i <= dias; i++){

    dayMessages[i] =
      retosDelMes[i - 1];

  }


  console.log(
    `🎲 Seleccionados ${retosDelMes.length} retos.`
  );

  console.log(
    "📋 Retos seleccionados:",
    dayMessages
  );

}


// BORRAR CALENDAR DE FIREBASE


async function borrarCalendar(){

  console.log(
    "🗑️ Borrando calendario anterior..."
  );


  const snapshot = await db
    .collection('calendar')
    .get();


  if(snapshot.empty){

    console.log(
      "ℹ️ Calendar ya estaba vacío."
    );

    return;
  }


  // Firestore permite un máximo de 500 operacioneS por batch. Como máximo tendrá 31, así que cabe perfectamente.

  const batch = db.batch();


  snapshot.forEach(doc => {

    batch.delete(doc.ref);

  });


  await batch.commit();


  console.log(
    `🗑️ Se han borrado ${snapshot.size} documentos.`
  );

}

// CREAR NUEVO CALENDARIO EN FIREBASE

async function crearNuevoCalendar(){

  console.log(
    "📅 Creando nuevo calendario..."
  );


  const batch = db.batch();


  for(let i = 1; i <= dias; i++){

    const ref = db
      .collection('calendar')
      .doc('day_' + i);


    batch.set(ref, {

      reto: dayMessages[i],

      songs: []

    });

  }


  await batch.commit();


  console.log(
    `💾 Nuevo calendario guardado: ${dias} días.`
  );

}

// GUARDAR MES ACTUAL

async function marcarMesActual(){

  const ref = db
    .collection('config')
    .doc('calendar');


  await ref.set({

    month: mesActual,
    year: añoActual

  });


  cambioDeMes = false;


  console.log(
    `💾 Mes ${mesActual}/${añoActual} guardado.`
  );

  console.log(
    "🔵 cambioDeMes = FALSE"
  );

}


// PREPARAR NUEVO MES


async function prepararNuevoMes(){

  console.log(
    "========================================"
  );

  console.log(
    "🌙 PREPARANDO NUEVO MES"
  );

  console.log(
    "========================================"
  );


  // 1. Borrar calendario anterior
  await borrarCalendar();
  // 2. Cargar pool de retos
  await cargarPoolRetos();
  // 3. Randomizar y seleccionar retos
  generarDayMessages();
  // 4. Guardar selección en Firebase
  await crearNuevoCalendar();
  // 5. Guardar mes actual
  await marcarMesActual();


  console.log(
    "========================================"
  );

  console.log(
    "✅ NUEVO MES PREPARADO"
  );

  console.log(
    "========================================"
  );

}



// LOGIN AUTOMÁTICO

function autoLogin(){

  const u = localStorage.getItem(
    'musicalUser'
  );

  const p = localStorage.getItem(
    'musicalPass'
  );


  if(
    u &&
    p &&
    allowedUsers[u]
  ){

    currentUser = u;

  }


  updateSessionUI();

}


// ACTUALIZAR SESIÓN


function updateSessionUI(){

  if(currentUser){

    sessionBar.innerHTML = `
      ${allowedUsers[currentUser]} ${currentUser}

      <button
        id="logoutBtnTop"
        onclick="logout()"
      >
        Salir
      </button>
    `;

  } else {

    sessionBar.innerHTML = "No login";

  }

}

// LOGOUT


function logout(){

  localStorage.clear();

  currentUser = null;

  updateSessionUI();

}


// CREAR CALENDARIO HTML


function crearCalendario(){

  calendar.innerHTML = '';


  for(let i = 1; i <= dias; i++){

    const d = document.createElement('div');

    d.className = 'day';

    d.id = 'day_' + i;

    d.onclick = () => openModal(i);

    calendar.appendChild(d);

  }

}


// CARGAR CALENDARIO DESDE FIREBASE


async function loadCalendarData(){

  calendarData = {};


  const snapshot = await db
    .collection('calendar')
    .get();


  snapshot.forEach(doc => {

    calendarData[doc.id] = doc.data();

  });



  // Crear dayMessages usando Firebase


  dayMessages = {};


  for(let i = 1; i <= dias; i++){

    const dayData =
      calendarData['day_' + i];


    if(dayData){

      dayMessages[i] =
        dayData.reto || `Reto del día ${i}`;

    }

  }

  // Actualizar calendario visual


  for(let i = 1; i <= dias; i++){

    updateDayStatus(i);

  }


  console.log(
    "📥 Calendario cargado desde Firebase."
  );

}


// ABRIR MODAL

function openModal(day){

  if(day > hoy) return;


  currentDay = day;


  document.getElementById(
    'dayTitle'
  ).innerText =
    dayMessages[day] ||
    ("Día " + day);


  if(currentUser){

    username.style.display = 'none';

    password.style.display = 'none';

  } else {

    username.style.display = 'block';

    password.style.display = 'block';

  }


  modal.style.display = 'flex';


  loadSong();


  history.pushState(
    {modal:true},
    ''
  );

}


// CERRAR MODAL

function closeModal(){

  modal.style.display = 'none';

}


modal.addEventListener(
  'click',
  e => {

    if(e.target === modal){

      closeModal();

    }

  }
);


window.addEventListener(
  'popstate',
  () => {

    if(modal.style.display === 'flex'){

      closeModal();

    }

  }
);


window.addEventListener(
  'keydown',
  e => {

    if(e.key === 'Escape'){

      closeModal();

    }

  }
);


// SPOTIFY

function convert(link){

  const m = link.match(
    /(track|album|playlist)[\\\/|:]([a-zA-Z0-9]+)/
  );


  if(m){

    return `https://open.spotify.com/embed/${m[1]}/${m[2]}`;

  }


  return null;

}


// GUARDAR CANCIÓN

async function saveSong(){

  let name = currentUser;

  let pass =
    localStorage.getItem('musicalPass');


  // Login si no existe sesión

  if(!name){

    name =
      username.value.trim();

    pass =
      password.value.trim();


    if(!allowedUsers[name]){

      return alert(
        "Usuario no permitido"
      );

    }


    const ref =
      db.collection('users').doc(name);


    const u =
      await ref.get();


    if(
      u.exists &&
      u.data().password !== pass
    ){

      return alert(
        "Contraseña incorrecta"
      );

    }


    if(!u.exists){

      await ref.set({
        password: pass
      });

    }


    localStorage.setItem(
      'musicalUser',
      name
    );

    localStorage.setItem(
      'musicalPass',
      pass
    );


    currentUser = name;

    updateSessionUI();

  }


  // Comprobar Spotify

  const embed =
    convert(
      spotifyLink.value.trim()
    );


  if(!embed){

    return alert(
      "Link inválido"
    );

  }


  // Documento del día

  const ref =
    db.collection('calendar')
      .doc('day_' + currentDay);


  const doc =
    await ref.get();


  if(!doc.exists){

    return alert(
      "Este día no existe en el calendario."
    );

  }


  const data = doc.data();


  let songs =
    data.songs || [];


  // Comprobar si ya envió

  if(
    songs.some(
      s => s.name === name
    )
  ){

    return alert(
      "Ya enviaste"
    );

  }


  // Comprobar límite

  if(songs.length >= 2){

    return alert(
      "Completo"
    );

  }


  // Añadir canción

  songs.push({

    name: name,

    link: embed

  });


  await ref.set({

    reto: data.reto,

    songs: songs

  });


  // Actualizar memoria local

  calendarData[
    'day_' + currentDay
  ] = {

    reto: data.reto,

    songs: songs

  };


  updateDayStatus(
    currentDay
  );


  loadSong();

}


// CARGAR CANCIONES

function loadSong(){

  const result =
    document.getElementById('result');


  result.innerHTML = '';


  const data =
    calendarData[
      'day_' + currentDay
    ] || {};


  const songs =
    data.songs || [];


  if(songs.length === 0){

    result.innerHTML =
      "Ninguno ha enviado nada todavía...";

    return;

  }


  // Comprobar si el usuario ya envió

  const userSubmitted =
    songs.some(
      s => s.name === currentUser
    );


  songs.forEach(s => {


    // Usuario ya envió -> puede ver todo

    if(userSubmitted){

      result.innerHTML += `
        <div class="song-block">

          <b>${s.name}</b>

          <iframe
            src="${s.link}"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media">
          </iframe>

        </div>
      `;

    }


    // Usuario todavía no envió

    else {

      if(s.name === currentUser){

        result.innerHTML += `
          <div class="song-block">

            <b>${s.name}</b>

            <iframe
              src="${s.link}"
              frameborder="0"
              allowtransparency="true"
              allow="encrypted-media">
            </iframe>

          </div>
        `;

      } else {

        result.innerHTML += `
          <div class="song-block">

            <b>${s.name}</b><br>

            🔒 Todavía no has enviado
            tu canción

          </div>
        `;

      }

    }

  });

}


// ACTUALIZAR ESTADO DEL DÍA

function updateDayStatus(day){

  const el =
    document.getElementById(
      'day_' + day
    );


  if(!el) return;


  const data =
    calendarData[
      'day_' + day
    ] || {};


  const songs =
    data.songs || [];


  let title =
    (day > hoy)
      ? "🔒"
      : (
          data.reto ||
          dayMessages[day] ||
          day
        );


  el.innerHTML = `
    <div>${title}</div>
  `;


  // Iconos de usuarios

  let avatars =
    '<div class="avatars">';


  Object.keys(
    allowedUsers
  ).forEach(u => {

    avatars += `
      ${allowedUsers[u]}
      ${songs.some(
        s => s.name === u
      ) ? '✔️' : '❌'}
    `;

  });


  avatars += '</div>';


  el.innerHTML += avatars;


  // Estado visual

  el.classList.remove(
    'empty',
    'partial',
    'full',
    'locked'
  );


  if(songs.length === 0){

    el.classList.add('empty');

  }
  else if(songs.length === 1){

    el.classList.add('partial');

  }
  else {

    el.classList.add('full');

  }


  if(day > hoy){

    el.classList.add('locked');

  }

}


// INICIALIZACIÓN

async function init(){

  try {

    console.log(
      `📅 Fecha actual: ${hoy}/${mesActual}/${añoActual}`
    );

    console.log(
      `📆 Días de este mes: ${dias}`
    );


    // Login

    autoLogin();


    // Comprobar cambio de mes
    await comprobarCambioDeMes();
    // SI ES UN MES NUEVO

    if(cambioDeMes){

      await prepararNuevoMes();

    }


    // Crear calendario HTML

    crearCalendario();


    // Cargar calendario desde Firebase

    await loadCalendarData();


    console.log(
      "✅ Inicialización terminada."
    );


  } catch(error) {

    console.error(
      "❌ ERROR DURANTE LA INICIALIZACIÓN:",
      error
    );


    alert(
      "Se produjo un error al cargar el calendario. " +
      "Revisa la consola del navegador (F12)."
    );

  }

}


// INICIAR
init();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Musical</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 20px;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}
h1 { text-align:center; margin-bottom:30px; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:15px;
  max-width:1000px;
  margin:auto;
}
.day {
  border-radius:16px;
  padding:15px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.day:hover { transform:scale(1.03); }
.locked { opacity:0.4; cursor:not-allowed; }
.empty { background:#1e1e1e; }
.partial { background:#d4a017; }
.full { background:#1db954; }
.avatars { display:flex; justify-content:center; gap:10px; margin-top:10px; }
.avatar { font-size:20px; }
.modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  display:none; justify-content:center; align-items:center;
}
.modal-content {
  background:#1c1c1c;
  padding:25px;
  border-radius:16px;
  width:90%; max-width:500px;
  animation:pop 0.3s ease;
}
@keyframes pop {
  from { transform:scale(0.8); opacity:0; }
  to { transform:scale(1); opacity:1; }
}
.reveal { animation:reveal 0.6s ease; }
@keyframes reveal {
  from { transform:rotateY(90deg); opacity:0; }
  to { transform:rotateY(0); opacity:1; }
}
input,button { width:100%; margin-top:10px; padding:10px; border:none; border-radius:8px; }
button { background:#1db954; color:white; }
iframe { width:100%; margin-top:10px; }
.song-block { margin-top:15px; }
#logoutBtn { margin-top:10px; background:#ff4d4d; }
</style>
</head>
<body>

<h1>🎵 Calendario Musical</h1>
<div class="grid" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="dayTitle"></h2>
    <input id="username" placeholder="Nombre">
    <input id="password" type="password" placeholder="Contraseña">
    <input id="spotifyLink" placeholder="Link Spotify">
    <button onclick="saveSong()">Guardar</button>
    <button id="logoutBtn" onclick="logout()">Cerrar sesión</button>
    <div id="result"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCHpr65I6f7Ap4VQ3Q1Y6engILO_ImAe4M",
  authDomain: "retocanciones.firebaseapp.com",
  projectId: "retocanciones"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const calendar = document.getElementById('calendar');
const modal = document.getElementById('modal');
const today = new Date().getDate();

const allowedUsers = { "Carlo":"🧑‍🎧", "Sara":"🎸" };
const dayMessages = {
  1:"Empieza 🎵", 2:"Otra joya", 3:"Día especial", 4:"movida 4", 
  5:"coche", 6:"misa coche", 7:"tara motor hembra", 
  8:"cacion de dia ocho", 9:"cancion de dia 9", 10:"cancion dia 10"
};

let currentDay = null;
let currentUser = null;

// Inicializar calendario
for (let i = 1; i <= 30; i++) {
  const d = document.createElement('div');
  d.className = 'day';
  d.id = 'day_' + i;
  d.onclick = () => openModal(i);
  calendar.appendChild(d);
  updateDayStatus(i);
}

// Abrir modal
function openModal(day) {
  if (day > today) return; // Bloqueado
  currentDay = day;

  // Revisar si usuario guardado
  const storedUser = localStorage.getItem('musicalUser');
  const storedPass = localStorage.getItem('musicalPass');
  if (storedUser && storedPass && allowedUsers[storedUser]) {
    currentUser = storedUser;
    username.value = storedUser;
    password.value = storedPass;
  } else {
    currentUser = null;
    username.value = '';
    password.value = '';
  }

  document.getElementById('dayTitle').innerText = dayMessages[day] || ('Día ' + day);
  modal.style.display = 'flex';
  document.querySelector('.modal-content').classList.add('reveal');
  loadSong();
  history.pushState({modalOpen:true}, '', '');
}

// Cerrar modal
function closeModal() {
  modal.style.display = 'none';
  document.querySelector('.modal-content').classList.remove('reveal');
  if (history.state && history.state.modalOpen) history.back();
}

// Click fuera del contenido
modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});

// Botón atrás móviles
window.addEventListener('popstate', e => {
  if (modal.style.display === 'flex') closeModal();
});

// Convertir link Spotify
function convert(link) {
  const m = link.match(/(track|album|playlist)[\/|:]([a-zA-Z0-9]+)/);
  if (m) return `https://open.spotify.com/embed/${m[1]}/${m[2]}`;
  return null;
}

// Guardar canción
async function saveSong() {
  const name = username.value.trim();
  const pass = password.value.trim();
  const link = spotifyLink.value.trim();

  if (!allowedUsers[name]) return alert('Usuario no permitido');
  currentUser = name;

  const embed = convert(link);
  if (!embed) return alert('Link inválido');

  const userRef = db.collection('users').doc(name);
  const u = await userRef.get();
  if (u.exists && u.data().password !== pass) return alert('Contraseña incorrecta');
  if (!u.exists) await userRef.set({password:pass});

  // Guardar en localStorage
  localStorage.setItem('musicalUser', name);
  localStorage.setItem('musicalPass', pass);

  const ref = db.collection('calendar').doc('day_' + currentDay);
  const doc = await ref.get();
  let songs = doc.exists ? doc.data().songs || [] : [];
  if (songs.some(s => s.name === name)) return alert('Ya enviaste');
  if (songs.length >= 2) return alert('Completo');

  songs.push({name, link:embed});
  await ref.set({songs});

  loadSong();
  updateDayStatus(currentDay);
}

// Cerrar sesión
function logout() {
  localStorage.removeItem('musicalUser');
  localStorage.removeItem('musicalPass');
  currentUser = null;
  username.value = '';
  password.value = '';
}

// Cargar canciones en modal
async function loadSong() {
  const result = document.getElementById('result');
  result.innerHTML = '';

  const doc = await db.collection('calendar').doc('day_' + currentDay).get();
  if (!doc.exists) return result.innerHTML = 'Nada aún';

  const songs = doc.data().songs || [];
  const userSubmitted = songs.some(s => s.name === currentUser);

  songs.forEach(s => {
    if (userSubmitted || s.name === currentUser) {
      result.innerHTML += `<div class="song-block"><b>${s.name}</b><iframe src="${s.link}"></iframe></div>`;
    } else {
      result.innerHTML += `<div class="song-block"><b>${s.name}</b> 🔒</div>`;
    }
  });
}

// Actualizar estado de cada día
async function updateDayStatus(day) {
  const el = document.getElementById('day_' + day);
  const doc = await db.collection('calendar').doc('day_' + day).get();
  let songs = doc.exists ? doc.data().songs || [] : [];

  // Días futuros solo 🔒
  let titleHTML = (day > today) ? '🔒' : (dayMessages[day] || ('Día ' + day));
  el.innerHTML = `<div>${titleHTML}</div>`;

  // Avatares
  let avatarsHTML = '<div class="avatars">';
  Object.keys(allowedUsers).forEach(u => {
    const has = songs.some(s => s.name === u);
    avatarsHTML += `<span class="avatar">${allowedUsers[u]} ${has?'✔️':'❌'}</span>`;
  });
  avatarsHTML += '</div>';
  el.innerHTML += avatarsHTML;

  // Colores según cantidad de canciones
  el.classList.remove('empty','partial','full');
  if (songs.length === 0) el.classList.add('empty');
  else if (songs.length === 1) el.classList.add('partial');
  else if (songs.length >= 2) el.classList.add('full');

  if (day > today) el.classList.add('locked');
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Musical</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; background:#121212; color:white; padding:20px; }
    h1 { text-align:center; }

    .grid {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
      max-width:800px;
      margin:0 auto;
    }

    .day {
      background:#1e1e1e;
      padding:20px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
    }

    .modal {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.8);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal-content {
      background:#222;
      padding:20px;
      border-radius:10px;
      width:90%; max-width:500px;
    }

    input, button {
      width:100%; margin-top:10px; padding:10px;
      border-radius:5px; border:none;
    }

    button { background:#1db954; color:white; cursor:pointer; }

    iframe { width:100%; height:80px; margin-top:10px; }
  </style>
</head>
<body>

<h1>Calendario Musical</h1>
<div class="grid" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="dayTitle"></h2>

    <input type="text" id="username" placeholder="Nombre">
    <input type="password" id="password" placeholder="Contraseña">
    <input type="text" id="spotifyLink" placeholder="Enlace Spotify">

    <button onclick="saveSong()">Guardar</button>

    <div id="result"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyCHpr65I6f7Ap4VQ3Q1Y6engILO_ImAe4M",
  authDomain: "retocanciones.firebaseapp.com",
  projectId: "retocanciones",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const calendar = document.getElementById('calendar');
  const modal = document.getElementById('modal');
  const dayTitle = document.getElementById('dayTitle');

  let currentDay = null;

  for (let i = 1; i <= 30; i++) {
    const day = document.createElement('div');
    day.className = 'day';
    day.innerText = 'Día ' + i;
    day.onclick = () => openModal(i);
    calendar.appendChild(day);
  }

  function openModal(day) {
    currentDay = day;
    dayTitle.innerText = 'Día ' + day;
    modal.style.display = 'flex';
    loadSong();
  }

  window.onclick = e => { if (e.target === modal) modal.style.display='none'; };

  async function saveSong() {
    const name = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const link = document.getElementById('spotifyLink').value.trim();

    if (!name || !pass || !link) {
      alert('Completa todos los campos');
      return;
    }

    // 🔧 Convertir enlace de Spotify correctamente a formato embed
    function convertToEmbed(link) {
      try {
        // 🔁 Si es enlace corto (spotify.link), intentar expandir
        if (link.includes('spotify.link')) {
          alert('Los enlaces cortos de móvil (spotify.link) no funcionan directamente. Abre el enlace en tu navegador y copia la URL completa.');
          return null;
        }

        const url = new URL(link);

        // Limpiar parámetros tipo ?si=
        const cleanPath = url.pathname.split('?')[0];
        const parts = cleanPath.split('/').filter(Boolean);

        if (parts.length >= 2) {
          const type = parts[0];
          const id = parts[1];

          if (!['track','album','playlist'].includes(type)) {
            return null;
          }

          return `https://open.spotify.com/embed/${type}/${id}`;
        }
      } catch (e) {
        return null;
      }

      return null;
    }

    const embedLink = convertToEmbed(link);

    if (!embedLink) {
      alert('Enlace de Spotify no válido');
      return;
    }

    // 🔐 Validar usuario
    const userRef = db.collection('users').doc(name);
    const userDoc = await userRef.get();

    if (userDoc.exists) {
      if (userDoc.data().password !== pass) {
        alert('Contraseña incorrecta');
        return;
      }
    } else {
      // crear usuario
      await userRef.set({ password: pass });
    }

    const docRef = db.collection('calendar').doc('day_' + currentDay);
    const doc = await docRef.get();

    let songs = [];
    if (doc.exists) songs = doc.data().songs || [];

    // 🚫 evitar duplicado por nombre
    if (songs.some(s => s.name === name)) {
      alert('Ya has añadido canción en este día');
      return;
    }

    if (songs.length >= 2) {
      alert('Este día ya tiene 2 canciones');
      return;
    }

    songs.push({ name, link: embedLink });

    await docRef.set({ songs });

    loadSong();
  }

  async function loadSong() {
    const result = document.getElementById('result');
    result.innerHTML = 'Cargando...';

    const doc = await db.collection('calendar').doc('day_' + currentDay).get();

    if (!doc.exists) {
      result.innerHTML = '<p>Nadie ha añadido canción aún</p>';
      return;
    }

    const songs = doc.data().songs || [];

    if (songs.length === 0) {
      result.innerHTML = '<p>Nadie ha añadido canción aún</p>';
      return;
    }

    result.innerHTML = '';

    songs.forEach(song => {
      result.innerHTML += `
        <p><strong>${song.name}</strong> eligió:</p>
        <iframe src="${song.link}"></iframe>
      `;
    });
  }
</script>

</body>
</html>

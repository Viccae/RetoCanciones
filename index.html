<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto De Canciones</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { font-family:'Segoe UI'; margin:0; padding:20px; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); color:white;}
h1{text-align:center; margin-top:40px;}

/* sesión arriba izquierda */
#sessionBar{
  position:relative;
  text-align:right;
  font-size:12px;
  margin-bottom:10px;
}

#logoutBtnTop{
  display:inline-block;
  width:auto !important;
  background:#ff4d4d;
  border:none;
  padding:3px 6px;
  font-size:11px;
  margin-left:5px;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;max-width:1000px;margin:auto;}

.day{
  border-radius:16px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.locked{opacity:.4;cursor:not-allowed;}
.empty{background:#1e1e1e;}
.partial{background:#d4a017;}
.full{background:#1db954;}

.avatars{
  display:flex;
  justify-content:center;
  gap:6px;
  font-size:14px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#1c1c1c;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:500px;
}

input,button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
}

button{background:#1db954;color:white;}

.song-block{margin-top:10px;}
</style>
</head>

<body>

<div id="sessionBar"></div>

<h1>🎶 Reto De Canciones</h1>

<div class="grid" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="dayTitle"></h2>

    <input id="username" placeholder="Nombre">
    <input id="password" type="password" placeholder="Contraseña">
    <input id="spotifyLink" placeholder="Link Spotify">

    <button onclick="saveSong()">Guardar</button>

    <div id="result"></div>
  </div>
</div>

<script>

<script>

// ============================================================
// FIREBASE
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyCHpr65I6f7Ap4VQ3Q1Y6engILO_ImAe4M",
  authDomain: "retocanciones.firebaseapp.com",
  projectId: "retocanciones"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


// ============================================================
// ELEMENTOS HTML
// ============================================================

const calendar = document.getElementById('calendar');
const modal = document.getElementById('modal');
const sessionBar = document.getElementById('sessionBar');


// ============================================================
// FECHA ACTUAL
// ============================================================

const ahora = new Date();

const añoActual = ahora.getFullYear();
const mesActual = ahora.getMonth() + 1;
const hoy = ahora.getDate();


// Número de días del mes actual
const dias = new Date(
  añoActual,
  mesActual,
  0
).getDate();


// ============================================================
// CAMBIO DE MES
// ============================================================

// Esta variable será:
// true  = hay que preparar un nuevo mes
// false = seguimos en el mismo mes

let cambioDeMes = false;


// ============================================================
// RETOS
// ============================================================

let dayMessages = {};

let poolRetos = [];


// ============================================================
// USUARIOS
// ============================================================

const allowedUsers = {
  "Carlo": "🤡",
  "Sara": "💀"
};

let currentUser = null;
let currentDay = null;
let calendarData = {};


// ============================================================
// COMPROBAR CAMBIO DE MES
// ============================================================

async function comprobarCambioDeMes(){

  const ref = db.collection('config').doc('calendar');

  const doc = await ref.get();


  // ----------------------------------------------------------
  // Primera vez que se utiliza el calendario
  // ----------------------------------------------------------

  if(!doc.exists){

    cambioDeMes = true;

    console.log("🌱 No existe configuración del calendario.");
    console.log("🌱 Se considera un nuevo mes.");

    return;
  }


  // ----------------------------------------------------------
  // Leer configuración existente
  // ----------------------------------------------------------

  const datos = doc.data();

  const ultimoMes = datos.month;
  const ultimoAño = datos.year;


  // ----------------------------------------------------------
  // Comparar mes y año
  // ----------------------------------------------------------

  if(
    ultimoMes !== mesActual ||
    ultimoAño !== añoActual
  ){

    cambioDeMes = true;

    console.log("🌙 CAMBIO DE MES DETECTADO");
    console.log(
      `Anterior: ${ultimoMes}/${ultimoAño}`
    );
    console.log(
      `Actual: ${mesActual}/${añoActual}`
    );

  } else {

    cambioDeMes = false;

    console.log("📅 Seguimos en el mismo mes.");

  }

}


// ============================================================
// GUARDAR MES ACTUAL
// ============================================================

async function marcarMesActual(){

  const ref = db.collection('config').doc('calendar');

  await ref.set({
    month: mesActual,
    year: añoActual
  });

  cambioDeMes = false;

  console.log(
    `💾 Mes ${mesActual}/${añoActual} guardado en Firestore.`
  );

}


// ============================================================
// CARGAR POOL DE RETOS DESDE GITHUB
// ============================================================

async function cargarPoolRetos(){

  try {

    const response = await fetch('retos.json');


    if(!response.ok){
      throw new Error(
        `No se pudo cargar retos.json (${response.status})`
      );
    }


    poolRetos = await response.json();


    // Comprobar que realmente sea un array
    if(!Array.isArray(poolRetos)){
      throw new Error(
        "retos.json no contiene una lista válida."
      );
    }


    console.log(
      `📝 Pool de retos cargado: ${poolRetos.length} retos.`
    );


  } catch(error){

    console.error(
      "❌ Error cargando el pool de retos:",
      error
    );

    alert(
      "No se pudo cargar el archivo de retos."
    );

  }

}


// ============================================================
// MEZCLAR RETOS
// ============================================================

function mezclar(array){

  const copia = [...array];


  // Algoritmo Fisher-Yates

  for(
    let i = copia.length - 1;
    i > 0;
    i--
  ){

    const j = Math.floor(
      Math.random() * (i + 1)
    );


    [
      copia[i],
      copia[j]
    ] = [
      copia[j],
      copia[i]
    ];

  }


  return copia;

}


// ============================================================
// GENERAR DAYMESSAGES
// ============================================================

function generarDayMessages(){

  dayMessages = {};


  // Comprobar que tenemos suficientes retos

  if(poolRetos.length < dias){

    console.warn(
      `⚠️ Hay ${poolRetos.length} retos disponibles, ` +
      `pero este mes necesita ${dias}.`
    );

  }


  // Mezclar todo el pool

  const retosMezclados = mezclar(poolRetos);


  // Seleccionar los necesarios

  const retosDelMes = retosMezclados.slice(
    0,
    dias
  );


  // Crear dayMessages

  for(let i = 1; i <= dias; i++){

    dayMessages[i] =
      retosDelMes[i - 1] ||
      `Reto del día ${i}`;

  }


  console.log(
    `🎲 Se han seleccionado ${retosDelMes.length} retos para este mes.`
  );


  console.log(
    "📋 dayMessages:",
    dayMessages
  );

}


// ============================================================
// LOGIN AUTOMÁTICO
// ============================================================

function autoLogin(){

  const u = localStorage.getItem(
    'musicalUser'
  );

  const p = localStorage.getItem(
    'musicalPass'
  );


  if(
    u &&
    p &&
    allowedUsers[u]
  ){

    currentUser = u;

  }


  updateSessionUI();

}


// ============================================================
// ACTUALIZAR SESIÓN
// ============================================================

function updateSessionUI(){

  if(currentUser){

    sessionBar.innerHTML = `
      ${allowedUsers[currentUser]} ${currentUser}
      <button
        id="logoutBtnTop"
        onclick="logout()"
      >
        Salir
      </button>
    `;

  } else {

    sessionBar.innerHTML = "No login";

  }

}


// ============================================================
// LOGOUT
// ============================================================

function logout(){

  localStorage.clear();

  currentUser = null;

  updateSessionUI();

}


// ============================================================
// CREAR CALENDARIO
// ============================================================

function crearCalendario(){

  calendar.innerHTML = '';


  for(let i = 1; i <= dias; i++){

    const d = document.createElement('div');

    d.className = 'day';

    d.id = 'day_' + i;

    d.onclick = () => openModal(i);

    calendar.appendChild(d);

  }

}


// ============================================================
// CARGAR DATOS DE FIRESTORE
// ============================================================

async function loadCalendarData(){

  calendarData = {};


  const snapshot =
    await db.collection('calendar').get();


  snapshot.forEach(doc => {

    // Ignorar el documento de configuración
    if(doc.id === 'config') return;


    calendarData[doc.id] =
      doc.data().songs || [];

  });


  for(let i = 1; i <= dias; i++){

    updateDayStatus(i);

  }

}


// ============================================================
// ABRIR MODAL
// ============================================================

function openModal(day){

  if(day > hoy) return;


  currentDay = day;


  document.getElementById(
    'dayTitle'
  ).innerText =
    dayMessages[day] ||
    ("Día " + day);


  if(currentUser){

    username.style.display = 'none';

    password.style.display = 'none';

  } else {

    username.style.display = 'block';

    password.style.display = 'block';

  }


  modal.style.display = 'flex';


  loadSong();


  history.pushState(
    {modal:true},
    ''
  );

}


// ============================================================
// CERRAR MODAL
// ============================================================

function closeModal(){

  modal.style.display = 'none';

}


modal.addEventListener(
  'click',
  e => {

    if(e.target === modal){

      closeModal();

    }

  }
);


window.addEventListener(
  'popstate',
  () => {

    if(modal.style.display === 'flex'){

      closeModal();

    }

  }
);


window.addEventListener(
  'keydown',
  e => {

    if(e.key === 'Escape'){

      closeModal();

    }

  }
);


// ============================================================
// SPOTIFY
// ============================================================

function convert(link){

  const m = link.match(
    /(track|album|playlist)[\\/|:]([a-zA-Z0-9]+)/
  );


  if(m){

    return `https://open.spotify.com/embed/${m[1]}/${m[2]}`;

  }


  return null;

}


// ============================================================
// GUARDAR CANCIÓN
// ============================================================

async function saveSong(){

  let name = currentUser;

  let pass =
    localStorage.getItem('musicalPass');


  // ----------------------------------------------------------
  // Login si todavía no existe sesión
  // ----------------------------------------------------------

  if(!name){

    name =
      username.value.trim();

    pass =
      password.value.trim();


    if(!allowedUsers[name]){

      return alert(
        "Usuario no permitido"
      );

    }


    const ref =
      db.collection('users').doc(name);

    const u =
      await ref.get();


    if(
      u.exists &&
      u.data().password !== pass
    ){

      return alert(
        "Contraseña incorrecta"
      );

    }


    if(!u.exists){

      await ref.set({
        password: pass
      });

    }


    localStorage.setItem(
      'musicalUser',
      name
    );

    localStorage.setItem(
      'musicalPass',
      pass
    );


    currentUser = name;

    updateSessionUI();

  }


  // ----------------------------------------------------------
  // Comprobar Spotify
  // ----------------------------------------------------------

  const embed =
    convert(
      spotifyLink.value.trim()
    );


  if(!embed){

    return alert(
      "Link inválido"
    );

  }


  // ----------------------------------------------------------
  // Guardar canción
  // ----------------------------------------------------------

  const ref =
    db.collection('calendar')
      .doc('day_' + currentDay);


  const doc =
    await ref.get();


  let songs =
    doc.exists
      ? doc.data().songs || []
      : [];


  if(
    songs.some(
      s => s.name === name
    )
  ){

    return alert(
      "Ya enviaste"
    );

  }


  if(songs.length >= 2){

    return alert(
      "Completo"
    );

  }


  songs.push({
    name: name,
    link: embed
  });


  await ref.set({
    songs: songs
  });


  calendarData[
    'day_' + currentDay
  ] = songs;


  updateDayStatus(
    currentDay
  );


  loadSong();

}


// ============================================================
// CARGAR CANCIONES
// ============================================================

function loadSong(){

  const result =
    document.getElementById('result');


  result.innerHTML = '';


  const songs =
    calendarData[
      'day_' + currentDay
    ] || [];


  if(songs.length === 0){

    result.innerHTML =
      "Ninguno ha enviado nada todavía...";

    return;

  }


  // Comprobar si el usuario ya ha enviado

  const userSubmitted =
    songs.some(
      s => s.name === currentUser
    );


  songs.forEach(s => {


    // --------------------------------------------------------
    // Si ya envió -> puede ver todo
    // --------------------------------------------------------

    if(userSubmitted){

      result.innerHTML += `
        <div class="song-block">

          <b>${s.name}</b>

          <iframe
            src="${s.link}"
            frameborder="0"
            allowtransparency="true"
            allow="encrypted-media">
          </iframe>

        </div>
      `;

    }


    // --------------------------------------------------------
    // Si todavía no envió
    // --------------------------------------------------------

    else {

      if(s.name === currentUser){

        result.innerHTML += `
          <div class="song-block">

            <b>${s.name}</b>

            <iframe
              src="${s.link}"
              frameborder="0"
              allowtransparency="true"
              allow="encrypted-media">
            </iframe>

          </div>
        `;

      } else {

        result.innerHTML += `
          <div class="song-block">

            <b>${s.name}</b><br>

            🔒 Todavía no has enviado
            tu canción

          </div>
        `;

      }

    }

  });

}


// ============================================================
// ACTUALIZAR ESTADO DEL DÍA
// ============================================================

function updateDayStatus(day){

  const el =
    document.getElementById(
      'day_' + day
    );


  const songs =
    calendarData[
      'day_' + day
    ] || [];


  let title =
    (day > hoy)
      ? "🔒"
      : (
          dayMessages[day] ||
          day
        );


  el.innerHTML = `
    <div>${title}</div>
  `;


  // ----------------------------------------------------------
  // Iconos de usuarios
  // ----------------------------------------------------------

  let avatars =
    '<div class="avatars">';


  Object.keys(
    allowedUsers
  ).forEach(u => {

    avatars += `
      ${allowedUsers[u]}
      ${songs.some(
        s => s.name === u
      ) ? '✔️' : '❌'}
    `;

  });


  avatars += '</div>';


  el.innerHTML += avatars;


  // ----------------------------------------------------------
  // Estado visual
  // ----------------------------------------------------------

  el.classList.remove(
    'empty',
    'partial',
    'full'
  );


  if(songs.length === 0){

    el.classList.add('empty');

  }
  else if(songs.length === 1){

    el.classList.add('partial');

  }
  else {

    el.classList.add('full');

  }


  if(day > hoy){

    el.classList.add('locked');

  }

}


// ============================================================
// INICIALIZACIÓN
// ============================================================

async function init(){

  console.log(
    `📅 Fecha actual: ${hoy}/${mesActual}/${añoActual}`
  );

  console.log(
    `📆 Días de este mes: ${dias}`
  );


  // Login

  autoLogin();


  // Comprobar si es un mes nuevo

  await comprobarCambioDeMes();


  // ----------------------------------------------------------
  // Cargar pool de retos
  // ----------------------------------------------------------

  await cargarPoolRetos();


  // ----------------------------------------------------------
  // Generar retos aleatorios
  // ----------------------------------------------------------

  generarDayMessages();


  // ----------------------------------------------------------
  // Crear calendario
  // ----------------------------------------------------------

  crearCalendario();


  // ----------------------------------------------------------
  // Cargar canciones existentes
  // ----------------------------------------------------------

  await loadCalendarData();


  // ----------------------------------------------------------
  // INFORMACIÓN TEMPORAL DE PRUEBA
  // ----------------------------------------------------------

  if(cambioDeMes){

    console.log(
      "🟢 cambioDeMes = TRUE"
    );

    console.log(
      "➡️ Aquí posteriormente pondremos " +
      "el proceso de cambio de mes."
    );

  } else {

    console.log(
      "🔵 cambioDeMes = FALSE"
    );

  }

}


// ============================================================
// INICIAR
// ============================================================

init();

</script>

</body>
</html>

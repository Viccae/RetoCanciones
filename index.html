<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Musical</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; background:#121212; color:white; padding:20px; }
    h1 { text-align:center; }

    .grid {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
      max-width:800px;
      margin:0 auto;
    }

    .day {
      background:#1e1e1e;
      padding:20px;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
    }

    .modal {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.8);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal-content {
      background:#222;
      padding:20px;
      border-radius:10px;
      width:90%; max-width:500px;
    }

    input, button {
      width:100%; margin-top:10px; padding:10px;
      border-radius:5px; border:none;
    }

    button { background:#1db954; color:white; cursor:pointer; }

    iframe { width:100%; height:80px; margin-top:10px; }
  </style>
</head>
<body>

<h1>Calendario Musical</h1>
<div class="grid" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="dayTitle"></h2>

    <input type="text" id="username" placeholder="Nombre">
    <input type="password" id="password" placeholder="Contraseña">
    <input type="text" id="spotifyLink" placeholder="Enlace Spotify">

    <button onclick="saveSong()">Guardar</button>

    <div id="result"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
  apiKey: "AIzaSyCHpr65I6f7Ap4VQ3Q1Y6engILO_ImAe4M",
  authDomain: "retocanciones.firebaseapp.com",
  projectId: "retocanciones",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const calendar = document.getElementById('calendar');
  const modal = document.getElementById('modal');
  const dayTitle = document.getElementById('dayTitle');

  let currentDay = null;

  // 🗓️ Configuración de calendario
  const today = new Date();
  const currentDayOfMonth = today.getDate();

  // ✏️ Textos personalizados por día
  const dayMessages = {
    1: "Empieza el mes con música 🎵",
    2: "Segundo día, segunda joya",
    3: "Día 3: algo especial",
    4: "Hoy se desbloquea buena música",
    5: "Mitad de semana vibes",
    // puedes seguir hasta 30
  };

  for (let i = 1; i <= 30; i++) {
    const day = document.createElement('div');
    day.className = 'day';
    day.id = 'day_' + i;

    if (i > currentDayOfMonth) {
      day.innerText = 'Día ' + i + ' 🔒';
      day.style.opacity = '0.5';
      day.style.cursor = 'not-allowed';
    } else {
      day.innerText = 'Día ' + i + ' (0/2)';
      day.onclick = () => openModal(i);
      updateDayStatus(i);
    }

    calendar.appendChild(day);
  }

  function openModal(day) {
    // 🚫 Seguridad extra
    if (day > currentDayOfMonth) return;

    currentDay = day;

    // Mostrar mensaje personalizado
    const message = dayMessages[day] || 'Día ' + day;
    dayTitle.innerText = message;

    modal.style.display = 'flex';
    loadSong();
    updateDayStatus(currentDay);
  }

  window.onclick = e => { if (e.target === modal) modal.style.display='none'; };

  async function saveSong() {
    const name = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const link = document.getElementById('spotifyLink').value.trim();

    if (!name || !pass || !link) {
      alert('Completa todos los campos');
      return;
    }

    // 🔧 Convertir enlace de Spotify correctamente a formato embed
    function convertToEmbed(link) {
  try {
    // 🔥 Extraer ID de Spotify de múltiples formatos

    // Caso 1: spotify:track:ID
    if (link.startsWith('spotify:')) {
      const parts = link.split(':');
      if (parts.length === 3) {
        const type = parts[1];
        const id = parts[2];
        return `https://open.spotify.com/embed/${type}/${id}`;
      }
    }

    // Caso 2: URL normal o con parámetros
    const match = link.match(/(track|album|playlist)[\/|:]([a-zA-Z0-9]+)/);

    if (match) {
      const type = match[1];
      const id = match[2];
      return `https://open.spotify.com/embed/${type}/${id}`;
    }

    // Caso 3: enlaces cortos → no soportados
    if (link.includes('spotify.link')) {
      alert('Ese enlace es un link corto de Spotify. Ábrelo en el navegador y copia la URL completa.');
      return null;
    }

  } catch (e) {
    return null;
  }

  return null;
}

    const embedLink = convertToEmbed(link);

    if (!embedLink) {
      alert('Enlace de Spotify no válido');
      return;
    }

    // 🔐 Validar usuario
    const userRef = db.collection('users').doc(name);
    const userDoc = await userRef.get();

    if (userDoc.exists) {
      if (userDoc.data().password !== pass) {
        alert('Contraseña incorrecta');
        return;
      }
    } else {
      // crear usuario
      await userRef.set({ password: pass });
    }

    const docRef = db.collection('calendar').doc('day_' + currentDay);
    const doc = await docRef.get();

    let songs = [];
    if (doc.exists) songs = doc.data().songs || [];

    // 🚫 evitar duplicado por nombre
    if (songs.some(s => s.name === name)) {
      alert('Ya has añadido canción en este día');
      return;
    }

    if (songs.length >= 2) {
      alert('Este día ya tiene 2 canciones');
      return;
    }

    songs.push({ name, link: embedLink });

    await docRef.set({ songs });

    loadSong();
    updateDayStatus(currentDay);
  }

  async function updateDayStatus(day) {
    const dayEl = document.getElementById('day_' + day);

    const doc = await db.collection('calendar').doc('day_' + day).get();

    let count = 0;
    if (doc.exists) {
      const songs = doc.data().songs || [];
      count = songs.length;
    }

    dayEl.innerText = `Día ${day} (${count}/2)`;

    // 🎨 Colores por estado
    if (count === 0) {
      dayEl.style.background = '#1e1e1e'; // gris oscuro
    } else if (count === 1) {
      dayEl.style.background = '#b8860b'; // amarillo
    } else if (count === 2) {
      dayEl.style.background = '#1db954'; // verde Spotify
    }
  }

  async function loadSong() {
    const result = document.getElementById('result');
    result.innerHTML = 'Cargando...';

    const doc = await db.collection('calendar').doc('day_' + currentDay).get();

    if (!doc.exists) {
      result.innerHTML = '<p>Nadie ha añadido canción aún</p>';
      return;
    }

    const songs = doc.data().songs || [];

    if (songs.length === 0) {
      result.innerHTML = '<p>Nadie ha añadido canción aún</p>';
      return;
    }

    result.innerHTML = '';

    songs.forEach(song => {
      result.innerHTML += `
        <p><strong>${song.name}</strong> eligió:</p>
        <iframe src="${song.link}"></iframe>
      `;
    });
  }
</script>

</body>
</html>

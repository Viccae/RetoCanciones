<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto De Canciones</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body { font-family:'Segoe UI'; margin:0; padding:20px; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); color:white;}
h1{text-align:center; margin-top:40px;}

/* sesión arriba izquierda */
#sessionBar{
  position:relative;
  text-align:right;
  font-size:12px;
  margin-bottom:10px;
}

#logoutBtnTop{
  display:inline-block;
  width:auto !important;
  background:#ff4d4d;
  border:none;
  padding:3px 6px;
  font-size:11px;
  margin-left:5px;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;max-width:1000px;margin:auto;}

.day{
  border-radius:16px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.locked{opacity:.4;cursor:not-allowed;}
.empty{background:#1e1e1e;}
.partial{background:#d4a017;}
.full{background:#1db954;}

.avatars{
  display:flex;
  justify-content:center;
  gap:6px;
  font-size:14px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#1c1c1c;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:500px;
}

input,button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
}

button{background:#1db954;color:white;}

.song-block{margin-top:10px;}
</style>
</head>

<body>

<div id="sessionBar"></div>

<h1>🎶 Reto De Canciones</h1>

<div class="grid" id="calendar"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="dayTitle"></h2>

    <input id="username" placeholder="Nombre">
    <input id="password" type="password" placeholder="Contraseña">
    <input id="spotifyLink" placeholder="Link Spotify">

    <button onclick="saveSong()">Guardar</button>

    <div id="result"></div>
  </div>
</div>

<script>

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCHpr65I6f7Ap4VQ3Q1Y6engILO_ImAe4M",
  authDomain: "retocanciones.firebaseapp.com",
  projectId: "retocanciones"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const calendar = document.getElementById('calendar');
const modal = document.getElementById('modal');
const sessionBar = document.getElementById('sessionBar');

const today = new Date().getDate();


const dias = 31;
// 👇 EDITABLE
const dayMessages = {
1: "Que transmita rabia",
2: "En la que ocurre un accidente",
3: "Con intro de piano",
4: "La primera palabra del tema es el título de la canción",
5: "Que mencione una estación (primavera, verano, otoño, invierno o atocha)",
6: "Con una frase que te defina",
7:"Que hable sobre un deporte",
8: "La voz comienza antes de los instrumentos",
9: "Que suene como si estuviera grabada desde lejos",
10: "Que te haga sentir mejos cuando estás enfermo/a",
11: "Que te dé vergüenza poner",
12: "La que menciona otra banda",
13: "Que el título sea un pájaro",
14: "Que te encoja el estómago",
15: "Que mencione un deporte",
16: "Que se llame como tú o que mencione tu nombre",
17: "Menciona a un escritor",
18: "Con voces distorsionadas",
19: "Que te dé vergüenza poner",
20: "Una canción que mencione un día de la semana",
21: "Que mencione los signos del zodiaco",
22: "Una canción que te ponga cachondo/a",
23: "Que te recuerde a alguien de tu familia",
24: "La que se pregunta algo",
25: "Que hable del paso del tiempo",
26: "Una canción de alguién que ya no esté aquí",
27: "Cantada a dos voces",
28: "Una canción que incluya sonidos de ciudad (coches, tráfico, gente)",
29: "Una canción que tenga un aplauso",
30: "Una canción que mencione un edificio famoso",
31: "Que mencione un animal mitológico"
};

const allowedUsers = { "Carlo":"🤡","Sara":"💀" };

let currentUser=null;
let currentDay=null;
let calendarData={};


// LOGIN
function autoLogin(){
  const u=localStorage.getItem('musicalUser');
  const p=localStorage.getItem('musicalPass');
  if(u && p && allowedUsers[u]) currentUser=u;
  updateSessionUI();
}

function updateSessionUI(){
  if(currentUser){
    sessionBar.innerHTML = `${allowedUsers[currentUser]} ${currentUser}
    <button id="logoutBtnTop" onclick="logout()">Salir</button>`;
  } else sessionBar.innerHTML="No login";
}

function logout(){
  localStorage.clear();
  currentUser=null;
  updateSessionUI();
}


// CALENDARIO
for(let i=1;i<=dias;i++){
  const d=document.createElement('div');
  d.className='day';
  d.id='day_'+i;
  d.onclick=()=>openModal(i);
  calendar.appendChild(d);
}


// LOAD FIRESTORE
async function loadCalendarData(){
  const snapshot=await db.collection('calendar').get();
  snapshot.forEach(doc=>{
    calendarData[doc.id]=doc.data().songs||[];
  });
  for(let i=1;i<=dias;i++) updateDayStatus(i);
}


// OPEN
function openModal(day){
  if(day>today) return;
  currentDay=day;

  document.getElementById('dayTitle').innerText = dayMessages[day] || ("Día "+day);

  if(currentUser){
    username.style.display='none';
    password.style.display='none';
  } else {
    username.style.display='block';
    password.style.display='block';
  }

  modal.style.display='flex';
  loadSong();

  history.pushState({modal:true}, '');
}


// CLOSE
function closeModal(){ modal.style.display='none'; }

modal.addEventListener('click', e=>{
  if(e.target===modal) closeModal();
});

window.addEventListener('popstate', ()=>{
  if(modal.style.display==='flex') closeModal();
});

window.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});


// SPOTIFY
function convert(link){
  const m=link.match(/(track|album|playlist)[\\/|:]([a-zA-Z0-9]+)/);
  if(m) return `https://open.spotify.com/embed/${m[1]}/${m[2]}`;
  return null;
}


// SAVE
async function saveSong(){

  let name=currentUser;
  let pass=localStorage.getItem('musicalPass');

  if(!name){
    name=username.value.trim();
    pass=password.value.trim();

    if(!allowedUsers[name]) return alert("Usuario no permitido");

    const ref=db.collection('users').doc(name);
    const u=await ref.get();

    if(u.exists && u.data().password!==pass) return alert("Contraseña incorrecta");
    if(!u.exists) await ref.set({password:pass});

    localStorage.setItem('musicalUser',name);
    localStorage.setItem('musicalPass',pass);

    currentUser=name;
    updateSessionUI();
  }

  const embed=convert(spotifyLink.value.trim());
  if(!embed) return alert("Link inválido");

  const ref=db.collection('calendar').doc('day_'+currentDay);
  const doc=await ref.get();
  let songs=doc.exists ? doc.data().songs||[] : [];

  if(songs.some(s=>s.name===name)) return alert("Ya enviaste");
  if(songs.length>=2) return alert("Completo");

  songs.push({name,link:embed});
  await ref.set({songs});

  calendarData['day_'+currentDay]=songs;
  updateDayStatus(currentDay);
  loadSong();
}


// LOAD SONGS
function loadSong(){

  const result=document.getElementById('result');
  result.innerHTML='';

  const songs=calendarData['day_'+currentDay] || [];

  if(songs.length===0){
    result.innerHTML="Ninguno ha enviado nada todavía...";
    return;
  }

  // comprobar si ya envió una canción del día
  const userSubmitted = songs.some(s => s.name === currentUser);

  songs.forEach(s=>{

    // si ya envió -> ve todo
    if(userSubmitted){

      result.innerHTML += `
      <div class="song-block">
        <b>${s.name}</b>
        <iframe src="${s.link}"
        frameborder="0"
        allowtransparency="true"
        allow="encrypted-media"></iframe>
      </div>`;

    }

    // si NO envió -> solo ve la suya
    else {

      if(s.name === currentUser){

        result.innerHTML += `
        <div class="song-block">
          <b>${s.name}</b>
          <iframe src="${s.link}"
          frameborder="0"
          allowtransparency="true"
          allow="encrypted-media"></iframe>
        </div>`;

      } else {

        result.innerHTML += `
        <div class="song-block">
          <b>${s.name}</b><br>
          🔒 Todavía no has enviado tu canción
        </div>`;

      }

    }

  });

}


// UPDATE DAY
function updateDayStatus(day){
  const el=document.getElementById('day_'+day);
  const songs=calendarData['day_'+day]||[];

  let title = (day>today) ? "🔒" : (dayMessages[day] || day);

  el.innerHTML = `<div>${title}</div>`;

  // iconos usuarios
  let avatars='<div class="avatars">';
  Object.keys(allowedUsers).forEach(u=>{
    avatars += `${allowedUsers[u]} ${songs.some(s=>s.name===u)?'✔️':'❌'}`;
  });
  avatars+='</div>';

  el.innerHTML += avatars;

  el.classList.remove('empty','partial','full');

  if(songs.length===0) el.classList.add('empty');
  else if(songs.length===1) el.classList.add('partial');
  else el.classList.add('full');

  if(day>today) el.classList.add('locked');
}


// INIT
autoLogin();
loadCalendarData();

</script>

</body>
</html>
